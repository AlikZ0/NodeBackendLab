name: iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for iPhone
        run: |
          xcodegen generate
          xcodebuild -project NodeBackendLab.xcodeproj -scheme NodeBackendLab \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NodeBackendLab.app Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/NodeBackendLab.app/Info.plist
          zip -qr NodeBackendLab.ipa Payload
          unzip -tq NodeBackendLab.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NodeBackendLab-iOS
          path: NodeBackendLab.ipa
          if-no-files-found: error
